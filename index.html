<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Francia Music</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="vue@2.6.0"></script>
</head>

<body>

  <div id="app">
    <h1>Dan Francia</h1>

    <section id="music">
      <h2>Music</h2>
      <article v-for="entry in albumsByYearDesc">
        <div>
          <a class="italic" v-bind:href="entry.url">{{ entry.title }}</a>
          by
          <a class="artist" v-bind:href="artistLinks[entry.artist]">{{ entry.artist }}</a>
        </div>
        <div>
          <span class="label" v-if="!labelLinks[entry.label]">{{ entry.label }}</span><span
            v-if="!labelLinks[entry.label]">,</span>
          <span v-if="labelLinks[entry.label]">
            <a class="label" v-bind:href="labelLinks[entry.label]">{{ entry.label }}</a>,
          </span>
          <span class="year">{{ entry.year }}</span>
        </div>
        <small>{{ entry.role }}</small>
      </article>

      <article>
        <div>
          <a class="italic" href="https://www.discogs.com/artist/2199154-Daniel-Francia">Dan Francia</a>
          on
          <a class="artist" href="https://www.discogs.com/artist/2199154-Daniel-Francia">Discogs</a>
        </div>
      </article>
    </section>

    <section id="posts">

      <div class="post">
        <div class="title">
          The title of the post goes here
        </div>

        <div class="content">
          The content of the post
        </div>
      </div>
    </section>

    <div class="copyright">&copy; 2026</div>
  </div>


  <script src="main.js"></script>

</body>

</html>
