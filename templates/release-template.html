<article class="release">
  <img class="release-artwork" src="https://example.com/artwork.jpg" alt="Release Title cover art">

  <div class="release-body">
    <h2 class="release-title">Release Title</h2>
    <div class="release-date">Month Day, Year</div>

    <ol class="tracklist">
      <li>Track One (Writer)</li>
      <li>Track Two (Writer)</li>
    </ol>

    <div class="credits">
      <p>
        Performer One - instrument<br>
        Performer Two - instrument
      </p>
      <p>Recording/mixing/mastering credits go here.</p>
    </div>

    <!-- Delete this block if there's no video for the release. -->
    <div class="release-video">
      <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </div>
</article>
